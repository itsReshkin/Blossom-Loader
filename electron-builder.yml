appId: com.blossom.app
productName: Blossom
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
publish:
  provider: github
  owner: itsReshkin
  repo: Blossom-Loader
